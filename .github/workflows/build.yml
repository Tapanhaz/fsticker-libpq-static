name: Build static libpq and publish release assets

on:
  workflow_dispatch:
    inputs:
      pg_tag:
        description: "PostgreSQL git tag to build libpq from"
        required: true
        default: "REL_16_4"
      release_tag:
        description: "Release/tag name to publish under (leave blank to auto-derive as pq-<pg_tag>)"
        required: false
        default: ""


jobs:
  prepare:
    name: Resolve build parameters
    runs-on: ubuntu-26.04
    outputs:
      pg_tag: ${{ steps.resolve.outputs.pg_tag }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            pg_tag="${{ inputs.pg_tag }}"
            release_tag="${{ inputs.release_tag }}"
            if [[ -z "${release_tag}" ]]; then
              release_tag="pq-${pg_tag}"
            fi
          else
            release_tag="${GITHUB_REF_NAME}"
            pg_tag="${release_tag#pq-}"
          fi
          echo "pg_tag=${pg_tag}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            name: linux-x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-26.04-arm
            name: linux-aarch64
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-2025-vs2026
            name: windows-amd64
          - os: windows-11-vs2026-arm
            name: windows-arm64
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools (Linux, in manylinux container)
        if: runner.os == 'Linux'
        run: |
          yum install -y bison flex perl-IPC-Cmd
          python3 -m ensurepip --upgrade
          python3 -m pip install meson ninja
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja bison flex
      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install winflexbison3 -y
          python -m pip install meson ninja
      - name: Build static libpq
        run: bash build_libpq.sh "${{ needs.prepare.outputs.pg_tag }}" "${{ matrix.name }}"
        shell: bash
      - name: Package
        run: |
          cd dist
          tar -czf ../libpq-${{ needs.prepare.outputs.pg_tag }}-${{ matrix.name }}.tar.gz .
          sha256sum ../libpq-${{ needs.prepare.outputs.pg_tag }}-${{ matrix.name }}.tar.gz > \
            ../libpq-${{ needs.prepare.outputs.pg_tag }}-${{ matrix.name }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: libpq-${{ matrix.name }}
          path: libpq-*.tar.gz*

  release:
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: libpq-*
          path: dist
          merge-multiple: true
      - run: ls -R dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_tag }}
          files: dist/*